name = "maggakes-estate"
main = "src/server/index.ts"
compatibility_date = "2026-01-01"

# The built game is packed into the Worker by scripts/embed.mjs (npm run build).

[[durable_objects.bindings]]
name = "ESTATE"
class_name = "Estate"

# SQLite-backed Durable Objects work on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Estate"]

[observability]
enabled = true

workers_dev = true
preview_urls = false
